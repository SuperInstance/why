name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      - name: Tests (unit + golden corpus pairs)
        run: cargo test --workspace
      - name: CLI smoke
        run: |
          cargo run -q -p why-cli -- --version
          ec=0
          cargo run -q -p why-cli -- check why-core/tests/corpus/basic_dead/graph.txt --alive why-core/tests/corpus/basic_dead/att.txt --no-clock || ec=$?
          # exit 1 is the expected "findings present" contract
          [ "$ec" -eq 1 ] || { echo "expected exit 1, got $ec"; exit 1; }
