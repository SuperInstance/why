# Example GitHub Action — drop into .github/workflows/why.yml
# Fails the job on dead findings; strict mode enforces referential integrity.
name: why
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install why
        run: cargo install --path why-cli
      - name: Extract graph
        run: why extract . --out graph.txt
      - name: Check necessity
        run: |
          if [ -f att.txt ]; then
            # exit 1 on dead findings; strict adds integrity checks
            why check graph.txt --alive att.txt --strict
          else
            echo "No att.txt yet — statuses stay unknown until roots are attested"
            why check graph.txt
            cat graph.txt
          fi
      # Optional policy gate once adoption starts:
      #   why check graph.txt --alive att.txt --strict --fail-under 80
