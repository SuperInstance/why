[package]
name = "why-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for why - does this still deserve to exist?"

[[bin]]
name = "why"
path = "src/main.rs"

[dependencies]
why-core = { path = "../why-core" }
clap = { version = "=4.4.18", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
